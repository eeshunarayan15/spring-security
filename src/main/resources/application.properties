spring.application.name=springsecurity1
spring.output.ansi.enabled=always
# Customize console log pattern with colors
# logging.pattern.console=%d{HH:mm:ss.SSS} - %clr(%5level) - %msg%n
# logging.pattern.console=%d{HH:mm:ss.SSS} - %highlight(%5level) - [%thread] - %logger{36} - %msg%n
spring.security.user.name=${USERNAME:eeshu}
spring.security.user.password=${PASSWORD:123}
# logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
logging.level.org.springframework.security=trace
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
